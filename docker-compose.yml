# O serviço `db` foi removido daqui.
#
# Havia dois Postgres na máquina para nada: este, na versão 13, e o
# homelab-postgres, na 17. O 13 saiu de suporte em novembro de 2025 e não
# recebe mais correção de segurança, então a consolidação resolveu duas
# coisas de uma vez.
#
# Os dados foram migrados por dump e restauração, com as 13.352 linhas das
# 24 tabelas conferidas uma a uma. O container antigo e o volume `pgdata`
# continuam existindo, parados: são a volta atrás se algo aparecer depois.
#
# O Django tem NAME, USER, PASSWORD e PORT fixos no settings.py e só lê o
# HOST do ambiente — por isso o papel no banco compartilhado teve que nascer
# com exatamente o mesmo nome e senha, em vez de algo melhor.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # Nome do container na rede compartilhada, resolvido pelo DNS do Docker.
      DB_HOST: homelab-postgres
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    volumes:
      - ./sdizimo-back:/app
    ports:
      - "${SDIZIMO_WEB_PORT:-8000}:8000"
    networks:
      - default
      - homelab-shared

networks:
  # Rede de serviços comuns a várias stacks. Criada fora do compose, para
  # que nenhuma stack seja dona dela e a ordem de subida não importe.
  homelab-shared:
    external: true
