services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: sdizimo
      POSTGRES_USER: sdizimo
      POSTGRES_PASSWORD: sdizimo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "./sdizimo (1):/dump:ro"
      - ./docker/restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdizimo -d sdizimo"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: db
    volumes:
      - ./sdizimo-back:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
