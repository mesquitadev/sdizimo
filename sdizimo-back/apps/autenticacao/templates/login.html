{% extends 'base_auth.html' %}

{% block title %}SDízimo - Login{% endblock %}

{% block content %}
  <form id="login-form" method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'includes/form.html' %}
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
  <script>
    // Evita envio duplicado (clique duplo): o segundo POST chegaria com o
    // token CSRF antigo, ja trocado pelo login, e cairia num 403.
    document.getElementById('login-form').addEventListener('submit', function () {
      var btn = this.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
    });
  </script>
  <a href="{% url 'password_reset' %}" class="forgot-pass">Esqueceu sua senha?</a>
{% endblock %}
