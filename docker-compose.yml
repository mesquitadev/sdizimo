services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdizimo
      POSTGRES_USER: sdizimo
      POSTGRES_PASSWORD: sdizimo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/db/2022-03-08-pg13-dir:/dump:ro
      - ./docker/restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
    ports:
      - "${SDIZIMO_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdizimo -d sdizimo"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    volumes:
      - ./sdizimo-back:/app
    ports:
      - "${SDIZIMO_WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
